<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านของฉัน – พอร์ตโฟลิโอสินค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3fa;--surface:#ffffff;--ink:#1b2253;--muted:#5d648f;--line:#d9ddef;
  --tag:#ff5c72;--tag-ink:#ffffff;--mango:#ffc83d;--mint:#1fa88a;--warn:#b45309;
  --shadow:0 10px 24px rgba(27,34,83,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12152b;--surface:#1c2142;--ink:#eef0ff;--muted:#a3a9d6;--line:#33396a;
  --tag:#ff6f83;--tag-ink:#1b0b10;--mango:#ffd25e;--mint:#3cd0ae;--warn:#fbbf24;
  --shadow:0 10px 24px rgba(0,0,0,.45);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12152b;--surface:#1c2142;--ink:#eef0ff;--muted:#a3a9d6;--line:#33396a;
  --tag:#ff6f83;--tag-ink:#1b0b10;--mango:#ffd25e;--mint:#3cd0ae;--warn:#fbbf24;
  --shadow:0 10px 24px rgba(0,0,0,.45);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:14.5px;line-height:1.55}
h1,h2,.price,button,.pill{font-family:'Prompt','Sarabun',sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 50px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.shop-name{font:800 clamp(22px,4.6vw,34px)/1.15 'Prompt',sans-serif;margin:0;border:0;background:transparent;color:var(--ink);width:100%;max-width:640px;padding:2px 0;border-bottom:3px dashed transparent}
.shop-name:not([readonly]):hover,.shop-name:focus{border-bottom-color:var(--tag);outline:none}
.contact{display:flex;gap:8px;align-items:center;color:var(--muted);margin-top:2px}
.contact input{border:0;background:transparent;color:var(--ink);font:600 16px 'Sarabun',sans-serif;border-bottom:2px dashed transparent;min-width:220px}
.contact input:not([readonly]):hover,.contact input:focus{border-bottom-color:var(--tag);outline:none}
.switch{display:inline-flex;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;color:var(--ink);padding:8px 18px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--mango);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 14px}
.count{font:700 15px 'Prompt',sans-serif}
.view{display:inline-flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 10px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.drop{display:block;border:3px dashed var(--tag);border-radius:22px;background:var(--surface);padding:22px 16px;text-align:center;cursor:pointer;transition:background .2s,transform .2s}
.drop.over{background:var(--mango);transform:scale(1.01)}
.drop b{display:block;font:800 clamp(16px,3.4vw,21px)/1.3 'Prompt',sans-serif}
.drop span{color:var(--muted)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.btn{display:inline-block;margin-top:14px;background:var(--tag);color:var(--tag-ink);border:0;border-radius:999px;padding:8px 20px;font:700 14px 'Prompt',sans-serif;pointer-events:none}
.list{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 2px 18px;-webkit-overflow-scrolling:touch}
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));overflow:visible}
.card{position:relative;flex:0 0 min(264px,78vw);scroll-snap-align:start;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:11px 11px 12px;margin-top:12px}
.grid .card{flex:initial}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--bg);border:4px solid var(--ink)}
.card.out .ph img{filter:grayscale(1) brightness(.8)}
.ph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;background:var(--line);margin-top:10px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.price{display:inline-block;background:var(--tag);color:var(--tag-ink);font-weight:800;font-size:17px;padding:1px 13px 1px 11px;border-radius:999px 10px 10px 999px;line-height:1.45}.was{color:var(--muted);text-decoration:line-through;font-size:15px}.save{display:inline-block;background:var(--mango);color:#1b2253;font:700 13px 'Prompt',sans-serif;padding:2px 10px;border-radius:999px}
.sold{position:absolute;inset:0;display:grid;place-items:center;font:800 26px 'Prompt',sans-serif;color:#fff;background:rgba(18,21,43,.5)}
.name{font:700 15.5px/1.35 'Prompt',sans-serif;margin:12px 0 6px;word-break:break-word}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--mint)}
.pill.low{background:color-mix(in srgb,var(--mango) 30%,transparent);color:var(--warn)}
.pill.none{background:var(--line);color:var(--muted)}
.ask{width:100%;margin-top:12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px;font-weight:700;font-size:16px;cursor:pointer}
.ask:disabled{opacity:.4;cursor:not-allowed}
.fld{display:block;margin-top:10px;font-size:14px;color:var(--muted);font-weight:600}
.fld input{display:block;width:100%;margin-top:3px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 9px;font:600 14px 'Sarabun',sans-serif}
.fld input:focus{border-color:var(--tag);outline:none}
.row2{display:grid;grid-template-columns:1fr;gap:0}
.stock{display:flex;gap:6px;margin-top:3px}
.stock button{flex:0 0 40px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:20px;font-weight:700;cursor:pointer}
.stock input{margin:0;text-align:center;min-width:0}
.del{position:absolute;top:22px;right:24px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(18,21,43,.72);color:#fff;font-size:18px;cursor:pointer}
.empty{text-align:center;padding:50px 10px;color:var(--muted);font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.sec{font:800 clamp(16px,3.4vw,21px)/1.3 'Prompt',sans-serif;margin:26px 0 0}
.coll{border-radius:14px;overflow:hidden;aspect-ratio:1/1;background:var(--line);display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:10px}
.coll img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.coll img.tall{grid-row:span 2}
.coll img.solo{grid-column:1/-1;grid-row:1/-1}
.coll .more{display:grid;place-items:center;font:800 26px 'Prompt',sans-serif;background:rgba(18,21,43,.6);color:#fff}
.out .coll{filter:grayscale(1)}
.setcard{border:3px solid var(--mango)}
.contains{color:var(--muted);font-size:14px;margin:6px 0 4px}
.pick{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600;font-size:15px;cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--tag)}
.card:has(.pick input:checked){box-shadow:0 0 0 4px var(--mango),var(--shadow)}
.chip.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
#post{position:fixed;inset:0;background:rgba(10,12,30,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#post.open{display:flex}
.panel{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.panel img{width:100%;border-radius:12px;display:block;min-height:80px;background:var(--line)}
.panel textarea{width:100%;min-height:130px;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:16px 'Sarabun',sans-serif}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.acts button{flex:1;border:0;border-radius:12px;padding:11px;font:700 16px 'Prompt',sans-serif;cursor:pointer;background:var(--tag);color:var(--tag-ink)}
.acts button.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.fld textarea{display:block;width:100%;margin-top:3px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:16px/1.5 'Sarabun',sans-serif;resize:vertical}
.fld textarea:focus{border-color:var(--tag);outline:none}
.emo{display:flex;gap:2px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.emo button{flex:0 0 36px;height:36px;border:0;background:transparent;font-size:22px;cursor:pointer;border-radius:10px}
.emo button:hover{background:var(--bg)}
.cur{color:var(--tag);font-weight:800}
.desc{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;color:var(--muted);font-size:15px}
.rowact{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.rowact .pick{margin-top:0}
.rm{border:2px solid var(--tag);background:transparent;color:var(--tag);border-radius:10px;padding:5px 12px;font:600 14px 'Prompt',sans-serif;cursor:pointer}
.bgpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--mango)}
.tools{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow);margin-top:12px}
.tools[hidden]{display:none}
.selinfo{flex:1 1 100%;font:600 14px 'Prompt',sans-serif}
.chip.dng{border-color:var(--tag);color:var(--tag);background:var(--surface)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:4px}
.stepper button{flex:0 0 38px;height:38px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font-size:22px;font-weight:700;cursor:pointer}
.qty{flex:1;text-align:center;font:600 14px 'Prompt',sans-serif;line-height:1.25;color:var(--ink)}
.qty b{font-size:22px;font-weight:800}
.qty small{display:block;font:600 13px 'Sarabun',sans-serif;color:var(--mint)}
.qty.low small{color:var(--warn)}
.qty.zero small{color:var(--tag)}
.tabs{display:flex;gap:8px;margin-bottom:0;flex:0 0 auto}
.tabs button{flex:1;max-width:240px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:14px;padding:7px 12px;font:700 14.5px 'Prompt',sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
body.buy{--tag:#2fc9a6;--tag-ink:#06241d}
body{position:relative}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:10px;flex:none;filter:drop-shadow(0 3px 6px rgba(27,34,83,.25))}
body.custom-bg{background-size:cover;background-position:center;background-attachment:fixed}
body.custom-bg .bg{display:none}
body.custom-bg::before{content:"";position:fixed;inset:0;background:rgba(8,10,28,.62);z-index:-1;pointer-events:none}
.addrow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.rp .ph{background:#0b0d26}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:600}.chk[hidden]{display:none}
.pager{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pager .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#sideBtn{margin-left:auto}
.side{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px;z-index:18;display:flex;flex-direction:column;border-radius:18px;background:linear-gradient(180deg,#1b2253,#12153a);color:#fff;border:2px solid var(--mango);box-shadow:var(--shadow);overflow:hidden;transition:transform .3s}
.side-h{flex:none;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--mango);color:#1b2253;font:800 15px 'Prompt',sans-serif}
.side-ctl button{border:0;background:rgba(27,34,83,.14);color:#1b2253;width:30px;height:30px;border-radius:9px;cursor:pointer;margin-left:6px;font-size:14px}
#sideClose{display:none}
.side-win{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:2px 12px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 3%,#000 95%,transparent);mask-image:linear-gradient(180deg,transparent,#000 3%,#000 95%,transparent)}
.sc h4{margin:14px 0 6px;font:800 12px 'Prompt',sans-serif;color:var(--mango);letter-spacing:.04em}
.sc .u{display:flex;gap:9px;padding:8px 9px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.07)}
.sc .u i{font-style:normal;font-size:20px;flex:none;line-height:1.2}
.sc .u b{display:block;font:700 13.5px/1.35 'Prompt',sans-serif}
.sc .u span{display:block;font-size:12.5px;color:#cfd3f5;line-height:1.45}
.side-f{flex:none;padding:6px 12px;font-size:11.5px;color:#aab0e8;text-align:center;border-top:1px solid rgba(255,255,255,.12)}
.side-bd{display:none}
@media (min-width:1100px){body{padding-right:324px}#sideBtn{display:none}}
@media (max-width:1099px){.side{transform:translateX(125%);width:min(340px,88vw)}.side.open{transform:none}#sideClose{display:inline-block}.side-bd.open{display:block;position:fixed;inset:0;background:rgba(5,6,26,.55);z-index:17}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="wrap">
  <div class="top"><img class="logo" id="logo" alt="โลโก้แมวน่ารัก" width="38" height="38"><nav class="tabs" role="tablist" aria-label="เลือกหน้า"><button id="tabSell" role="tab" aria-selected="true">🛍️ ขายสินค้า</button><button id="tabBuy" role="tab" aria-selected="false">📦 รับของ</button></nav><label class="chip" title="เปลี่ยนภาพพื้นหลังเว็บ">🖼️ พื้นหลัง<input id="siteBg" type="file" accept="image/*" hidden></label><button class="chip" id="siteBgReset" type="button" title="กลับไปใช้พื้นหลังเดิม" hidden>↺</button><button class="chip go" id="sideBtn" type="button" aria-controls="side">📢 อัปเดต</button></div>
  <header>
    <div style="flex:1 1 320px">
      <input id="shopName" class="shop-name" maxlength="40" aria-label="ชื่อร้าน">
      <div class="contact"><span id="contactLbl">ติดต่อสั่งซื้อ:</span><input id="contact" maxlength="60" aria-label="ช่องทางติดต่อ"></div>
    </div>
  </header>

  <label id="drop" class="drop">
    <input id="file" type="file" accept="image/*" multiple>
    <b id="dropB">ลากรูปสินค้ามาวางที่นี่ได้เลย</b>
    <span id="dropS">เลือกได้หลายรูปพร้อมกัน แต่ละรูปจะกลายเป็นป้ายสินค้าหนึ่งใบ</span><br>
    <span class="btn">เลือกรูปจากเครื่อง</span>
  </label>

  <div class="addrow"><button class="chip go" id="addRP" type="button">➕ เพิ่มช่อง RP</button></div>
  <div class="bar">
    <div class="count" id="count"></div>
    <div class="view"><button class="chip" id="selAll">เลือกทั้งหมด</button></div>
  </div>
  <div id="list" class="list"></div>
  <h2 class="sec" id="setTitle" hidden>เซ็ตโปรโมชั่น</h2>
  <div id="sets" class="list"></div>
  <p class="hint" id="hint"></p>
  <div class="tools" id="tools"><span id="selInfo" class="selinfo"></span>
    <button class="chip go" id="mkPost">ภาพโพสต์สินค้าเดี่ยว</button>
    <button class="chip go" id="mkPostAll" title="เลือกทั้งสินค้าเดี่ยวและเซ็ต แล้วรวมเป็นภาพเดียว">ภาพโพสต์รวม (เดี่ยว + เซ็ต)</button>
    <button class="chip go" id="mkPostSet">ภาพโพสต์เซ็ตโปรโมชั่น</button>
    <button class="chip go" id="mkSet">สร้างเซ็ตโปรโมชั่น</button>
    <button class="chip dng" id="delSel">🗑️ ลบที่เลือก</button></div>
</div>
<div id="post" role="dialog" aria-modal="true" aria-label="ภาพโพสต์สินค้า"><div class="panel">
  <div class="bgpick"><span>พื้นหลัง</span><div id="sw" class="sw"></div><label class="chip">รูปพื้นหลังของคุณ<input id="bgFile" type="file" accept="image/*" hidden></label></div>
  <label class="chk" id="splitRow" hidden><input type="checkbox" id="split"> แยกเซ็ตละภาพ (1 เซ็ต = 1 รูป)</label><div class="pager" id="pager"></div>
  <img id="postImg" alt="">
  <textarea id="cap" aria-label="ข้อความประกอบโพสต์"></textarea>
  <div class="acts"><button id="saveImg">บันทึกเป็นรูปภาพ</button><button id="saveAll" class="alt" hidden>บันทึกทุกภาพ</button><button id="copyCap" class="alt">คัดลอกข้อความ</button><button id="closePost" class="alt">ปิด</button></div>
</div></div>
<aside class="side" id="side" aria-label="อัปเดตล่าสุด"><div class="side-h"><span>📢 อัปเดตล่าสุด</span><span class="side-ctl"><button id="sidePlay" type="button" aria-label="หยุดเลื่อนอัตโนมัติ">⏸</button><button id="sideClose" type="button" aria-label="ปิดแถบอัปเดต">✕</button></span></div><div class="side-win" id="sideWin"><div id="sideList"></div></div><div class="side-f">เลื่อนอัตโนมัติ · วางเมาส์หรือแตะเพื่อหยุดอ่าน</div></aside><div class="side-bd" id="sideBd"></div>
<div id="toast" role="status"></div>

<script>
const KEY='thai-portfolio-shop-v1';
const mkData=(shop)=>({shop,contact:'LINE: @yourshop',items:[],sets:[]});
let DB={page:'sell',sell:mkData('ร้านของฉัน'),buy:mkData('รายการรับของ')};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){if(r.sell||r.buy)DB=Object.assign(DB,r);else Object.assign(DB.sell,r)}}catch(e){}
['sell','buy'].forEach(k=>{DB[k].items=DB[k].items||[];DB[k].sets=DB[k].sets||[]});
if(DB.page!=='buy')DB.page='sell';
let S=DB[DB.page];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('พื้นที่จัดเก็บเต็ม ลองลบสินค้าบางรายการ')}}
const fmt=n=>Number(n||0).toLocaleString('th-TH');
const sel=new Set(),selSets=new Set();
const TX={
 sell:{who:'ติดต่อสั่งซื้อ:',lbl:'ชื่อร้าน',dropB:'ลากรูปสินค้ามาวางที่นี่ได้เลย',dropS:'เลือกได้หลายรูปพร้อมกัน แต่ละรูปจะกลายเป็นป้ายสินค้าหนึ่งใบ',count:'สินค้าทั้งหมด',empty:'ยังไม่มีสินค้า เริ่มจากอัปโหลดรูปด้านบนได้เลย',price:'ราคา (บาท)',qty:'จำนวนที่มี',sqty:'จำนวนเซ็ต',sprice:'ราคาเซ็ต (บาท)',ok:'พร้อมขาย',low:'เหลือน้อย',lowOn:true,zero:'หมดแล้ว',sold:'สินค้าหมด',sec:'เซ็ตโปรโมชั่น',mkSet:'สร้างเซ็ตโปรโมชั่น',mkPost:'ภาพโพสต์สินค้าเดี่ยว',mkPostSet:'ภาพโพสต์เซ็ตโปรโมชั่น',setN:'เซ็ตโปรโมชั่น ',pT:'สินค้าของเรา',pS:'เซ็ตโปรโมชั่น',pOne:'ราคาปกติ ฿',pSet:'ราคาเซ็ต ฿',have:'เหลือ ',ct:'สั่งซื้อ: ',title:'ขายสินค้า'},
 buy:{who:'ติดต่อส่งของ:',lbl:'หัวข้อรับของ',dropB:'ลากรูปสินค้าที่ต้องการรับมาวางที่นี่ได้เลย',dropS:'เลือกได้หลายรูปพร้อมกัน แต่ละรูปจะกลายเป็นป้ายสินค้าที่ต้องการรับหนึ่งใบ',count:'สินค้าที่ต้องการรับ',empty:'ยังไม่มีสินค้าที่ต้องการรับ เริ่มจากอัปโหลดรูปด้านบนได้เลย',price:'ราคารับ (บาท)',qty:'จำนวนที่ต้องการรับ',sqty:'จำนวนเซ็ตที่ต้องการรับ',sprice:'ราคารับเซ็ต (บาท)',ok:'ต้องการรับ',low:'ต้องการรับ',lowOn:false,zero:'ยังไม่รับ',sold:'ยังไม่รับ',sec:'เซ็ตรับของ',mkSet:'สร้างเซ็ตรับของ',mkPost:'ภาพโพสต์สินค้าที่รับ',mkPostSet:'ภาพโพสต์เซ็ตรับของ',setN:'เซ็ตรับของ ',pT:'สินค้าที่ต้องการรับ',pS:'เซ็ตที่ต้องการรับ',pOne:'รับชิ้นละ ฿',pSet:'รับเซ็ตละ ฿',have:'ต้องการ ',ct:'ติดต่อส่งของ: ',title:'รับของ'}
};
const T=()=>TX[DB.page];
function applyTx(){const t=T(),b=DB.page==='buy';
  $('contactLbl').textContent=t.who;$('shopName').setAttribute('aria-label',t.lbl);$('shopName').placeholder=t.lbl;
  $('dropB').textContent=t.dropB;$('dropS').textContent=t.dropS;$('setTitle').textContent=t.sec;
  $('tabSell').setAttribute('aria-selected',!b);$('tabBuy').setAttribute('aria-selected',b);
  document.body.classList.toggle('buy',b);document.title=t.title+' – '+S.shop;
  $('addRP').textContent='➕ '+t.addRP;$('logo').src=CAT_LOGO;setFav(CAT_LOGO)}
function goPage(p){if(DB.page===p)return;DB.page=p;S=DB[p];sel.clear();selSets.clear();save();$('post').classList.remove('open');render();ticker();window.scrollTo({top:0})}
$('tabSell').onclick=()=>goPage('sell');$('tabBuy').onclick=()=>goPage('buy');

function render(){
  const seller=true;
  applyTx();$('shopName').value=S.shop;$('contact').value=S.contact;
  $('shopName').readOnly=$('contact').readOnly=!seller;
  
  
  $('drop').style.display=seller?'block':'none';
  $('count').textContent=S.items.length?`${T().count} ${S.items.length} รายการ`:'';
  $('hint').textContent=seller?'แก้ชื่อ ราคา และจำนวนได้ที่ป้ายแต่ละใบ ติ๊กเลือกที่ป้ายเพื่อสร้างเซ็ต สร้างภาพโพสต์ หรือลบ ระบบบันทึกอัตโนมัติในเครื่องนี้':'';
  $('tools').hidden=$('selAll').hidden=!S.items.length;upBar();
  const L=$('list');L.className='list grid';renderSets();
  if(!S.items.length){L.innerHTML=`<div class="empty" style="grid-column:1/-1">${T().empty}</div>`;return}
  L.innerHTML=S.items.map(it=>{if(it.type==='rp')return rpCard(it);
    const out=Number(it.stock)<=0,low=!out&&Number(it.stock)<=3;
    const pill=out?'<span class="pill none">หมดแล้ว</span>':low?`<span class="pill low">เหลือเพียง ${fmt(it.stock)} ชิ้น</span>`:`<span class="pill">มีสินค้า ${fmt(it.stock)} ชิ้น</span>`;
    const img=`<div class="ph"><img src="${it.img}" alt="${esc(it.name)}">${out?'<div class="sold">'+T().sold+'</div>':''}</div><div class="prow"><span class="price">฿${fmt(it.price)}</span></div>`;
    if(seller)return `<article class="card ${out?'out':''}" data-id="${it.id}">
      <label class="pick"><input type="checkbox" data-a="pick" ${sel.has(it.id)?'checked':''}>เลือกสินค้านี้</label>${img}
      <label class="fld">ชื่อสินค้า<input data-f="name" value="${esc(it.name)}" maxlength="60"></label>${descBox(it)}
      <div class="row2">
        <label class="fld">${T().price}<input data-f="price" type="number" min="0" inputmode="decimal" value="${it.price}"></label>
        <div class="fld">${T().qty}<div class="stepper"><button type="button" data-a="dec" aria-label="ลดจำนวน">−</button>${qty(it.stock,'ชิ้น')}<button type="button" data-a="inc" aria-label="เพิ่มจำนวน">+</button></div></div>
      </div></article>`;
    return `<article class="card ${out?'out':''}" data-id="${it.id}">${img}
      <div class="name">${esc(it.name)}</div>${it.desc?`<p class="desc">${esc(it.desc)}</p>`:''}${pill}
      <button class="ask" data-a="ask" ${out?'disabled':''}>${out?'สินค้าหมด':'สนใจสินค้านี้'}</button></article>`;
  }).join('');
}

const qty=(n,u)=>{n=Number(n)||0;return `<output class="qty ${n<=0?'zero':(T().lowOn&&n<=3)?'low':''}"><b>${n}</b> ${u}<small>${n<=0?T().zero:(T().lowOn&&n<=3)?T().low:T().ok}</small></output>`};
function armed(b){if(b.dataset.arm)return true;b.dataset.arm='1';b.dataset.t=b.textContent;b.textContent='แตะอีกครั้งเพื่อยืนยันลบ';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.t}},3000);return false}
const EMO=['🌸','💖','✨','🎀','🧸','🍓','🛍️','🔥','🆕','💯','🎁','🚚','⭐','🌈','😍','🥰','🍰','☕'];
const descBox=o=>`<label class="fld">คำอธิบาย<textarea data-f="desc" rows="3" maxlength="200" placeholder="เช่น เนื้อผ้านุ่ม ส่งฟรี 🚚">${esc(o.desc||'')}</textarea></label><div class="emo" aria-label="เลือกอิโมจิ">${EMO.map(m=>`<button type="button" data-a="emo" data-e="${m}" aria-label="ใส่ ${m}">${m}</button>`).join('')}</div>`;
const rec=c=>c.dataset.set?S.sets.find(x=>x.id===c.dataset.set):S.items.find(x=>x.id===c.dataset.id);
function setInfo(s){const its=s.itemIds.map(id=>S.items.find(i=>i.id===id)).filter(Boolean);const total=its.reduce((a,i)=>a+Number(i.price||0),0)*(s.mult||1);return{its,total,off:Math.max(0,total-Number(s.price||0))}}
function prowHTML(s){const{total,off}=setInfo(s);return `<span class="price">฿${fmt(s.price)}</span>`+(DB.page!=='buy'&&total>Number(s.price||0)?`<span class="was">฿${fmt(total)}</span><span class="save">ประหยัด ฿${fmt(off)}</span>`:'')}
function coll(its){const a=its.slice(0,4),m=its.length-4;return `<div class="coll">${a.map((i,k)=>(k===3&&m>0)?`<div class="more">+${m+1}</div>`:`<img src="${i.img}" alt="${esc(i.name)}" ${a.length===3&&k===0?'class="tall"':a.length===1?'class="solo"':''}>`).join('')}</div>`}
function renderSets(){
  const seller=true,box=$('sets');
  S.sets=S.sets.filter(s=>setInfo(s).its.length);selSets.forEach(id=>{if(!S.sets.some(s=>s.id===id))selSets.delete(id)});upBar();
  $('setTitle').hidden=!S.sets.length;$('mkPostSet').hidden=$('mkPostAll').hidden=!seller||!S.sets.length;box.className='list grid';
  box.innerHTML=S.sets.map(s=>{
    const{its}=setInfo(s),st=Number(s.stock),out=st<=0;
    const head=`${coll(its)}<div class="prow">${prowHTML(s)}</div>`;
    const has=`<p class="contains">ประกอบด้วย ${its.map(i=>esc(i.name)).join(', ')}${s.mult>1?' × '+s.mult+' ชิ้น':''}</p>`;
    if(seller)return `<article class="card setcard ${out?'out':''}" data-set="${s.id}"><label class="pick"><input type="checkbox" data-a="pick" ${selSets.has(s.id)?'checked':''}>เลือกเซ็ตนี้</label>${head}${has}
      <label class="fld">ชื่อเซ็ต<input data-f="name" value="${esc(s.name)}" maxlength="60"></label>${descBox(s)}
      <div class="row2"><label class="fld">${T().sprice}<input data-f="price" type="number" min="0" inputmode="decimal" value="${s.price}"></label>
      <div class="fld">${T().sqty}<div class="stepper"><button type="button" data-a="dec" aria-label="ลดจำนวน">−</button>${qty(s.stock,'เซ็ต')}<button type="button" data-a="inc" aria-label="เพิ่มจำนวน">+</button></div></div></div></article>`;
    const pill=out?'<span class="pill none">หมดแล้ว</span>':st<=3?`<span class="pill low">เหลือเพียง ${fmt(st)} เซ็ต</span>`:`<span class="pill">มี ${fmt(st)} เซ็ต</span>`;
    return `<article class="card setcard ${out?'out':''}" data-set="${s.id}">${head}<div class="name">${esc(s.name)}</div>${has}${s.desc?`<p class="desc">${esc(s.desc)}</p>`:''}${pill}<button class="ask" data-a="ask" ${out?'disabled':''}>${out?'เซ็ตหมด':'สนใจเซ็ตนี้'}</button></article>`;
  }).join('');
}
// Seller edits (no re-render on typing, to keep focus)
document.querySelector('.wrap').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const it=rec(e.target.closest('.card'));if(!it)return;
  it[f]=(f==='name'||f==='desc')?e.target.value:Math.max(0,Number(e.target.value)||0);save();
  const c=e.target.closest('.card');
  if((f==='rp'||f==='rate')&&it.type==='rp'){it.price=rpPrice(it);save();c.querySelector('.price').textContent='฿'+fmt(it.price);c.querySelector('.was').textContent=fmt(it.rp)+' RP'}
  if(f==='price'){if(c.dataset.set)c.querySelector('.prow').innerHTML=prowHTML(it);else c.querySelector('.price').textContent='฿'+fmt(it.price)}
  if(f==='name'&&!c.dataset.set)c.querySelector('img').alt=it.name;
  if(f==='stock'){const cu=c.querySelector('.cur');if(cu)cu.textContent=it.stock}
});
document.querySelector('.wrap').addEventListener('change',e=>{
  const t=e.target,c=t.closest('.card');if(!c)return;
  if(t.dataset.a==='pick'){const st=c.dataset.set?selSets:sel,id=c.dataset.set||c.dataset.id;t.checked?st.add(id):st.delete(id);upBar();return}
  if(t.dataset.f==='stock')return render();
  if(t.dataset.f==='rp'||t.dataset.f==='rate'){const r=rec(c);log('RP '+fmt(r.rp)+' = ฿'+fmt(r.price),'rp'+r.id)}
  if(t.dataset.f==='price'){const r=rec(c);log('ปรับราคา '+r.name+' เป็น ฿'+fmt(r.price),'prc'+(c.dataset.set||c.dataset.id))}
  if(!c.dataset.set&&(['price','name','rp','rate'].includes(t.dataset.f)))renderSets();
});
document.querySelector('.wrap').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const it=rec(b.closest('.card'));if(!it)return;
  const a=b.dataset.a;
  if(a==='del'){if(armed(b)){S.items=S.items.filter(x=>x!==it);sel.delete(it.id);S.sets.forEach(s=>s.itemIds=s.itemIds.filter(i=>i!==it.id));save();render()}}
  if(a==='emo'){const ta=b.closest('.card').querySelector('textarea'),s0=ta.selectionStart??ta.value.length,s1=ta.selectionEnd??s0,em=b.dataset.e;ta.value=ta.value.slice(0,s0)+em+ta.value.slice(s1);const pos=s0+em.length;ta.focus();ta.setSelectionRange(pos,pos);it.desc=ta.value;save();return}
  if(a==='delset'){if(armed(b)){S.sets=S.sets.filter(x=>x!==it);save();render()}return}
  if(a==='inc'||a==='dec'){it.stock=Math.max(0,(Number(it.stock)||0)+(a==='inc'?1:-1));log((DB.page==='buy'?'ปรับจำนวนรับ ':'ปรับจำนวน ')+it.name+' เป็น '+it.stock,'stk'+it.id);render()}
  if(a==='ask'){
    const msg=`สนใจ “${it.name}” ราคา ฿${fmt(it.price)} ค่ะ/ครับ`;
    try{navigator.clipboard.writeText(msg)}catch(_){}
    toast(`คัดลอกข้อความแล้ว ส่งถึงผู้ขายได้ที่ ${S.contact}`);
  }
});
$('shopName').addEventListener('input',e=>{S.shop=e.target.value;save()});
$('contact').addEventListener('input',e=>{S.contact=e.target.value;save()});





const CAT_LOGO='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff9ab0"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#bg)"/><path d="M50 53c10 0 12-12 5-16" fill="none" stroke="#ff9d4d" stroke-width="5" stroke-linecap="round"/><path d="M13 30L11 9l15 9zM51 30l2-21-15 9z" fill="#ff9d4d"/><path d="M16 26l-1-11 8 5zM48 26l1-11-8 5z" fill="#ffb3c4"/><ellipse cx="32" cy="37" rx="21" ry="18" fill="#ffad5c"/><path d="M26 21v5M32 19v6M38 21v5" stroke="#e67a2e" stroke-width="2" stroke-linecap="round"/><ellipse cx="32" cy="43" rx="12" ry="9" fill="#fff6ea"/><circle cx="23" cy="36" r="4" fill="#1b2253"/><circle cx="41" cy="36" r="4" fill="#1b2253"/><circle cx="24.4" cy="34.6" r="1.4" fill="#fff"/><circle cx="42.4" cy="34.6" r="1.4" fill="#fff"/><ellipse cx="16.5" cy="42" rx="3.6" ry="2.4" fill="#ff8fa6" opacity=".75"/><ellipse cx="47.5" cy="42" rx="3.6" ry="2.4" fill="#ff8fa6" opacity=".75"/><path d="M30 41h4l-2 2.6z" fill="#ff6f8e"/><path d="M32 43.6v1.6M28.4 46c1.8 1.6 3.6 1.6 3.6-.6 0 2.2 1.8 2.2 3.6.6" fill="none" stroke="#1b2253" stroke-width="1.5" stroke-linecap="round"/><path d="M10 40l7 1.5M10 45l7-1M54 40l-7 1.5M54 45l-7-1" stroke="#7a4a2a" stroke-width="1.2" stroke-linecap="round"/></svg>`);
// ---- RP logo, RP slot, site background
const _lg={};
function rpLogo(kind){return _lg[kind]||(_lg[kind]=(()=>{
  const buy=kind==='buy',a=buy?['#7af0d4','#4ea3ff']:['#ffe27a','#ff7a2f'];
  const L='<path d="M44 142V58H78Q100 58 100 80Q100 102 78 102H44M72 102L102 142M118 142V58H152Q174 58 174 80Q174 102 152 102H118"/>';

let posterCv=null,posterKind='single',posterList=[],posterIdx=0;
let posterBg={color:'#f1f3fa',img:null},rg=0;
const BG=[['#f1f3fa','ฟ้าอ่อน'],['#ffe3ea','ชมพู'],['#fff1c2','เหลือง'],['#d9f5ec','มิ้นต์'],['#e8e4ff','ม่วงอ่อน'],['#ffffff','ขาว']];
function swatches(){$('sw').innerHTML=BG.map(([v,n])=>`<button type="button" class="swb" data-bg="${v}" style="background:${v}" aria-label="พื้นหลังสี${n}" aria-pressed="${!posterBg.img&&posterBg.color===v}"></button>`).join('')+(posterBg.img?'<button type="button" class="chip" id="bgClear">ล้างรูปพื้นหลัง</button>':'')}
async function regen(){const my=++rg,im=$('postImg');im.alt='กำลังสร้างภาพ…';
  const multi=posterKind==='set'&&selSets.size>1;$('splitRow').hidden=!multi;const split=multi&&$('split').checked;
  try{const ids=S.sets.filter(x=>selSets.has(x.id));
    const jobs=split?ids.map(x=>({n:x.name,o:[x.id]})):[{n:'',o:null}],out=[];
    for(const j of jobs){const cv=await makePoster(posterKind,j.o);if(my!==rg)return;out.push({cv,name:j.n,o:j.o})}
    posterList=out;posterIdx=Math.min(posterIdx,out.length-1);showPoster()}
  catch(e){im.alt='สร้างภาพไม่สำเร็จ ลองลดจำนวนสินค้า'}}
function showPoster(){const im=$('postImg'),p=posterList[posterIdx];if(!p)return;posterCv=p.cv;im.src=p.cv.toDataURL('image/png');
  im.alt=posterKind==='set'?'ภาพโพสต์เซ็ตโปรโมชั่น':posterKind==='all'?'ภาพโพสต์รวมสินค้าเดี่ยวและเซ็ต':'ภาพโพสต์สินค้าเดี่ยว';$('cap').value=caption(posterKind,p.o);
  $('pager').innerHTML=posterList.length>1?posterList.map((x,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${i===posterIdx}">${i+1}. ${esc(x.name)}</button>`).join(''):'';
  $('saveAll').hidden=posterList.length<2}
$('pager').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;posterIdx=+b.dataset.i;showPoster()});
$('split').onchange=()=>{posterIdx=0;regen()};
$('sw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='bgClear')posterBg={color:posterBg.color,img:null};else if(b.dataset.bg)posterBg={color:b.dataset.bg,img:null};else return;
  swatches();regen()});
$('bgFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  const im=await loadImg(URL.createObjectURL(f));if(!im){toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่น');return}
  posterBg={color:posterBg.color,img:im};swatches();regen()});
async function openPost(kind){
  if(kind==='set'?!selSets.size:kind==='all'?!(sel.size&&selSets.size):!sel.size){toast('ติ๊กเลือกสินค้าหรือเซ็ตก่อน');return}
  posterKind=kind;swatches();const im=$('postImg');im.removeAttribute('src');im.alt='กำลังสร้างภาพ…';$('cap').value=caption(kind);$('post').classList.add('open');posterCv=null;posterIdx=0;
  await regen();
}
$('mkPost').onclick=()=>openPost('single');$('mkPostSet').onclick=()=>openPost('set');$('mkPostAll').onclick=()=>openPost('all');

async function getDl(){try{return window.claude&&claude.use?await claude.use('downloads'):null}catch(e){return null}}
async function saveCv(cv,name,d){const b=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(d){try{await d.save({filename:name,data:b});return true}catch(e){if(!e||e.code!=='declined')toast('บันทึกไม่สำเร็จ ลองกดค้างที่รูปเพื่อบันทึก');return false}}
  if(window.claude){toast('บันทึกอัตโนมัติไม่ได้ที่นี่ กดค้างหรือคลิกขวาที่รูปเพื่อบันทึก');return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
$('saveImg').onclick=async()=>{if(!posterCv)return;const d=await getDl();if(await saveCv(posterCv,'shop-post-'+posterKind+(posterList.length>1?'-'+(posterIdx+1):'')+'.png',d))toast('บันทึกรูปแล้ว')};
$('saveAll').onclick=async()=>{const d=await getDl();let n=0;for(let i=0;i<posterList.length;i++){if(await saveCv(posterList[i].cv,'shop-post-set-'+(i+1)+'.png',d))n++}if(n)toast('บันทึก '+n+' รูปแล้ว')};
$('copyCap').onclick=()=>{try{navigator.clipboard.writeText($('cap').value);toast('คัดลอกข้อความโพสต์แล้ว')}catch(e){$('cap').select()}};
$('closePost').onclick=()=>$('post').classList.remove('open');
$('post').addEventListener('click',e=>{if(e.target.id==='post')$('post').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('post').classList.remove('open')});

// Upload: resize each image so many fit in storage
function sharpen(c,amt){const w=c.width,h=c.height,x=c.getContext('2d'),d=x.getImageData(0,0,w,h).data,o=new Uint8ClampedArray(d),ce=1+4*amt,r4=w*4;
  for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){const p=(y*w+i)*4;for(let k=0;k<3;k++){o[p+k]=d[p+k]*ce-amt*(d[p+k-4]+d[p+k+4]+d[p+k-r4]+d[p+k+r4])}}
  x.putImageData(new ImageData(o,w,h),0,0)}
function shrink(file){return new Promise((ok,no)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{URL.revokeObjectURL(u);
    const w0=im.naturalWidth,h0=im.naturalHeight,L=Math.max(w0,h0),T=L<720?720:Math.min(L,900),k=T/L,tw=Math.max(1,Math.round(w0*k)),th=Math.max(1,Math.round(h0*k));
    let src=im,cw=w0,ch=h0;
    while(cw/2>=tw&&ch/2>=th){const t=document.createElement('canvas');t.width=Math.round(cw/2);t.height=Math.round(ch/2);const g=t.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,t.width,t.height);g.drawImage(src,0,0,t.width,t.height);src=t;cw=t.width;ch=t.height}
    const c=document.createElement('canvas');c.width=tw;c.height=th;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,tw,th);g.drawImage(src,0,0,tw,th);
    if(k!==1)sharpen(c,k>1?.35:.25);
    let q=.88,out=c.toDataURL('image/jpeg',q);while(out.length>200000&&q>.6){q-=.06;out=c.toDataURL('image/jpeg',q)}
    ok(out)}catch(e){no(e)}};
  im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
async function add(files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/'));
  if(!imgs.length){toast('กรุณาเลือกไฟล์รูปภาพ');return}
  let n=0;
  for(const f of imgs){try{
    const img=await shrink(f);
    S.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),img,name:f.name.replace(/\.[^.]+$/,'').slice(0,60)||'สินค้าใหม่',price:0,stock:1});n++;
  }catch(e){}}
  save();render();
  if(n){log('เพิ่มสินค้าใหม่ '+n+' รายการ');toast(`เพิ่ม ${n} รูปแล้ว ใส่ชื่อ ราคา และจำนวนได้เลย`);$('list').scrollTo({left:1e6,behavior:'smooth'})}
}
$('file').addEventListener('change',e=>{add(e.target.files);e.target.value=''});
const d=$('drop');
['dragenter','dragover'].forEach(v=>d.addEventListener(v,e=>{e.preventDefault();d.classList.add('over')}));
['dragleave','drop'].forEach(v=>d.addEventListener(v,e=>{e.preventDefault();d.classList.remove('over')}));
d.addEventListener('drop',e=>add(e.dataTransfer.files));
render();applySiteBg();ticker();requestAnimationFrame(tkLoop);
</script>
